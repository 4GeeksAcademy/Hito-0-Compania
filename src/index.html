<!doctype html>
<html lang="es">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>TrackFlow | Panel de Pruebas</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<script type="module" src="./main.js"></script>
</head>

<body class="min-h-screen bg-slate-100 text-slate-900">
	<main class="mx-auto w-full max-w-6xl px-4 py-8 sm:px-6 lg:px-8">
		<section class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
			<header class="border-b border-slate-200 px-6 py-5">
				<h1 class="text-2xl font-bold tracking-tight">TrackFlow</h1>
				<p class="mt-1 text-sm text-slate-600">Panel interno para pruebas manuales de utilidades en TypeScript.
				</p>
			</header>

			<div class="grid gap-6 p-6 lg:grid-cols-2">
				<section class="space-y-3 rounded-lg border border-slate-200 bg-slate-50 p-4">
					<h2 class="text-lg font-semibold">Datos de Prueba</h2>
					<p class="text-sm text-slate-600">Lista inicial de envios de ejemplo para validar filtros,
						ordenamientos y busquedas.</p>
					<ul id="lista-datos-prueba" class="space-y-2 text-sm"></ul>
				</section>

				<section class="space-y-4 rounded-lg border border-slate-200 bg-slate-50 p-4">
					<h2 class="text-lg font-semibold">Acciones</h2>

					<div class="grid gap-3">

						<div class="flex gap-2">
							<select id="select-transportista"
								class="flex-1 rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-700 focus:border-blue-500 focus:outline-none">
								<option value="UPS">UPS</option>
								<option value="MRW">MRW</option>
								<option value="DHL">DHL</option>
							</select>
							<button id="btn-filtrar-dinamico" type="button"
								class="rounded-md bg-blue-700 px-4 py-2 text-sm font-medium text-white transition hover:bg-blue-800">
								Filtrar
							</button>
						</div>
						<button id="btn-ordenar-costo" type="button"
							class="rounded-md bg-emerald-700 px-4 py-2 text-sm font-medium text-white transition hover:bg-emerald-800">
							Ordenar por Costo
						</button>

						<button id="btn-calcular-reportes" type="button"
							class="rounded-md bg-amber-700 px-4 py-2 text-sm font-medium text-white transition hover:bg-amber-800">
							Calcular Reportes (Totales, Promedios, Maximo y Minimo)
						</button>
					</div>

					<div class="space-y-2 border-t border-slate-200 pt-4">
						<label for="input-busqueda-id" class="block text-sm font-medium text-slate-700">ID para Busqueda
							Binaria</label>
						<div class="flex flex-col gap-2 sm:flex-row">
							<input id="input-busqueda-id" type="number" min="1" step="1" placeholder="Ejemplo: 1002"
								class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm outline-none ring-blue-500 focus:ring-2" />
							<button id="btn-busqueda-binaria" type="button"
								class="rounded-md bg-slate-800 px-4 py-2 text-sm font-medium text-white transition hover:bg-slate-900">
								Ejecutar Busqueda Binaria
							</button>
						</div>
					</div>
				</section>
			</div>

			<section class="border-t border-slate-200 px-6 py-5">
				<h2 class="text-lg font-semibold">Resultados</h2>
				<div id="resultados" class="mt-3 rounded-lg border border-slate-200 bg-slate-50 p-4 text-sm leading-6">
				</div>
			</section>
		</section>
	</main>
</body>

</html>
